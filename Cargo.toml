[package]
name = "armature-audit"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-audit"
homepage = "https://quinnjr.github.io/armature"
description = "Audit logging and compliance for Armature"
keywords = ["audit", "logging", "compliance", "security"]
categories = ["web-programming", "development-tools::debugging"]

[dependencies]
armature-core = { version = "0.8" }
# Read the VERIFIED principal (UserContext) that JwtAuthMiddleware attaches to
# request extensions, so the audit trail never trusts an unverified token.
armature-auth = { version = "0.2" }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
regex = "1.12"
base64 = "0.22"
tracing = "0.1"
once_cell = "1.21"
thiserror = "2.0"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
tempfile = "3.27"

